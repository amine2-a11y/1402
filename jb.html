<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Amine</title>
    <!-- This page carries its own styles and starts its own module, and it
         loads NOTHING else. That duplicates a little of style.css, and it is
         deliberate: every subresource is one more allocation and one more
         timing shift in the process that core.js is about to groom, and this
         exploit is decided by exactly that. The landing page may use the
         shared stylesheet; this one may not. -->
    <style>
/* Amine -- presentation layer only. Exploit and launch logic are unchanged. */
:root {
  --bg: #07111c;
  --panel: rgba(13, 29, 45, .92);
  --sunk: #091725;
  --line: rgba(105, 180, 205, .24);
  --fg: #d5e5ed;
  --bright: #f3fbff;
  --dim: #91aab9;
  --faint: #668091;
  --ok: #63e0c0;
  --bad: #ff858b;
  --warn: #f3ca78;
  --sans: "Segoe UI", system-ui, sans-serif;
  --mono: Consolas, "DejaVu Sans Mono", monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; min-height: 100%;
  background:
    radial-gradient(ellipse at 50% 38%, rgba(17, 91, 111, .26), transparent 48%),
    linear-gradient(145deg, #07111c 0%, #0a1b2b 52%, #08131f 100%);
  color: var(--fg); font: 15px/1.5 var(--sans);
}
#brand {
  padding: 17px 12px; border-bottom: 1px solid var(--line);
  background: rgba(5, 17, 29, .88); text-align: center;
  box-shadow: 0 8px 30px rgba(0,0,0,.16);
}
#brand b {
  color: var(--bright); font-size: 17px; font-weight: 800;
  letter-spacing: .32em; vertical-align: middle;
  text-shadow: 0 0 22px rgba(99,224,192,.28);
}
.byline {
  position: fixed; bottom: 12px; left: 14px; z-index: 9;
  margin: 0; color: var(--faint);
  font: 10px/1 var(--mono); letter-spacing: .18em;
}
.shell {
  display: flex; align-items: center; justify-content: center;
  flex-wrap: wrap; gap: 38px; min-height: calc(100vh - 58px);
  padding: 38px 22px 58px;
}
.meme { width: 260px; max-width: 40vw; height: auto; filter: drop-shadow(0 18px 32px rgba(0,0,0,.32)); }
.panel {
  width: min(360px, 92vw); padding: 28px;
  border: 1px solid var(--line); border-radius: 18px;
  background: linear-gradient(160deg, rgba(18,39,57,.94), rgba(8,23,37,.96));
  box-shadow: 0 24px 70px rgba(0,0,0,.28), inset 0 1px rgba(255,255,255,.035);
}
.lede {
  margin: 0 0 1.6em; color: var(--dim); font-size: 12px;
  letter-spacing: .13em; text-transform: uppercase;
}
.pick { margin: 0; }
.opt {
  display: block; margin-bottom: 10px; padding: 13px 14px;
  border: 1px solid var(--line); border-radius: 10px;
  background: rgba(5,17,29,.56); cursor: pointer;
  transition: border-color .18s ease, background .18s ease;
}
.opt:hover { border-color: rgba(99,224,192,.7); background: rgba(17,55,66,.52); }
.opt input { margin: 0 10px 0 0; accent-color: var(--ok); vertical-align: middle; }
.opt span { vertical-align: middle; }
.opt-auto {
  margin-top: 17px; border-style: dashed; background: transparent;
  color: var(--dim); font-size: 13px;
}
.btn {
  display: block; width: 100%; margin-top: 18px; padding: 14px 20px;
  border: 1px solid rgba(99,224,192,.55); border-radius: 10px;
  background: linear-gradient(110deg, #123f49, #145b59);
  color: #dffff7; font: 800 14px/1 var(--sans);
  letter-spacing: .2em; text-transform: uppercase; cursor: pointer;
  box-shadow: 0 8px 24px rgba(14,112,101,.18);
}
.btn:hover, .btn:focus { border-color: var(--ok); outline: none; filter: brightness(1.12); }
.count {
  margin: 12px 0 0; min-height: 1.2em; color: var(--ok);
  font: 11px/1.3 var(--mono); letter-spacing: .04em;
}
#spin {
  position: fixed; top: calc(50% + 20px); left: 50%;
  width: 46px; height: 46px; margin: -23px 0 0 -23px;
  border: 3px solid var(--line); border-top-color: var(--ok);
  border-radius: 50%; animation: spin .9s linear infinite;
  box-shadow: 0 0 24px rgba(99,224,192,.12);
}
@keyframes spin { to { transform: rotate(360deg); } }
#msg {
  position: fixed; top: 50%; left: 0; right: 0; transform: translateY(-50%);
  display: none; text-align: center; font-size: 16px; letter-spacing: .5px;
}
#wrap { padding: 0; }
#state, #out { display: none; }
body.done #spin, body.fail #spin { display: none; }
body.fail #msg { display: block; color: var(--bad); }
body.done #msg { display: block; color: var(--ok); font-weight: 800; letter-spacing: 2px; }
body.log { display: flex; flex-direction: column; height: 100vh; }
body.log #spin, body.log #msg { display: none; }
body.log #wrap {
  display: flex; flex-direction: column; flex: 1; min-height: 0;
  padding: 14px 18px 30px;
}
body.log #state { display: block; margin: 0 0 8px; font-size: 22px; font-weight: 700; }
body.log #out {
  display: block; flex: 1; min-height: 0; overflow-y: auto;
  padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
  background: rgba(4,15,25,.82); font: 12px/1.5 var(--mono); white-space: pre-wrap;
}
#ramBox {
  overflow: hidden; padding: 7px 12px; border-bottom: 1px solid var(--line);
  background: rgba(5,17,29,.78); color: var(--ok);
  font: 11px/1.4 var(--mono); text-overflow: ellipsis; white-space: nowrap;
}
.notice {
  margin: 1em 0; padding: .7em 1em; border: 1px solid #a94f5a;
  border-radius: 9px; background: rgba(75,22,32,.65); color: #ffabb0;
  font: 700 18px/1.4 var(--sans);
}
.ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); }
code { color: #9fd9e9; }
@media (max-width: 620px) {
  .shell { gap: 18px; padding: 25px 16px 52px; }
  .meme { width: 190px; max-width: 62vw; }
  .panel { padding: 22px; }
  #brand { padding: 14px 10px; }
}
    </style>
  </head>
  <body>
    <!-- jb.js owns the body class: .log while the step log is shown, .done or
         .fail once the chain has settled. The ids below are its contract --
         #ramBox, #msg, #state and #out are read by name. -->
    <div id="brand"><b>AMINE</b></div>
    <div id="ramBox">RAM: checking...</div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <p class="byline">AMINE PS4</p>
    <script type="module">
      import "./jb.js";
    </script>
  </body>
</html>
